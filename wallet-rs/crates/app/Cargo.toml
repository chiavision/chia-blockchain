[package]
name = "chia-wallet"
description = "Native Chia wallet built on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chia-wallet-core.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures = "0.3"
gpui = "0.2.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
getrandom = "0.3"
unicode-segmentation = "1"
zeroize = "1"

# GPUI precompiles its Metal shaders with `xcrun metal`, which only ships with
# full Xcode. Compile them at startup instead so the Command Line Tools suffice.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
