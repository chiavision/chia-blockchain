[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
chia-wallet-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Money code: an arithmetic overflow must crash, never wrap silently.
overflow-checks = true
panic = "abort"
strip = true

# GPUI is painfully slow unoptimised; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
